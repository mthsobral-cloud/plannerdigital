<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeOS — Bullet Journal & Roda da Vida</title>
    
    <!-- Configuração PWA para instalação no Celular (Android & iOS) -->
    <meta name="theme-color" content="#FF6B00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LifeOS">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #FFF7ED 50%, #F3E8FF 100%);
            color: #1E293B;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
        }
        .toast {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(120px);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Toast de Feedback Flutuante -->
    <div id="toast" class="toast fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 font-semibold text-xs">
        <span id="toast-msg">Operação realizada com sucesso!</span>
    </div>

    <!-- Cabeçalho Claro & Lúdico -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
            <!-- Logo e Subtítulo -->
            <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#FF6B00] to-amber-500 flex items-center justify-center shadow-md shadow-orange-500/20 text-white font-extrabold text-lg tracking-tighter">
                    •×
                </div>
                <div>
                    <div class="flex items-center gap-2.5 flex-wrap">
                        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">LifeOS</h1>
                        <span class="text-[11px] bg-orange-100 text-[#FF6B00] px-3 py-0.5 rounded-full font-bold">
                            Bullet Journal & Roda da Vida
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 italic mt-0.5">
                        "Metrifique sua vida a cada 6 meses com nuvem Google Drive & Tarefas."
                    </p>
                </div>
            </div>

            <!-- Indicadores Superiores + Botões Google -->
            <div class="flex items-center gap-2.5 sm:gap-3.5 flex-wrap justify-center">
                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-2 flex items-center gap-4 sm:gap-5">
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">MÉDIA DA RODA</div>
                        <div class="text-sm font-extrabold text-slate-800" id="header-media">7.0 / 10</div>
                    </div>
                    <div class="h-7 w-px bg-slate-200"></div>
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">TAREFAS</div>
                        <div class="text-sm font-extrabold text-emerald-600" id="header-concluidas">0 / 0</div>
                    </div>
                    <div class="h-7 w-px bg-slate-200"></div>
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">NUVEM DRIVE</div>
                        <div class="text-xs font-bold text-slate-500" id="cloud-sync-status">Offline (Local)</div>
                    </div>
                </div>

                <!-- Botão Forçar Sincronização da Nuvem -->
                <button id="force-sync-btn" onclick="forceCloudPull()" title="Baixar versão mais recente do Google Drive" class="bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                    <span id="force-sync-icon">↻</span>
                    <span>Sincronizar Nuvem</span>
                </button>

                <!-- Botão OAuth 2.0 Google (Tasks + Drive) -->
                <button id="google-auth-btn" onclick="handleGoogleAuth()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/></svg>
                    <span id="auth-status-text">Conectar Google</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Navegação em Pílulas Laranja -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 mt-7">
        <nav class="flex items-center gap-2 overflow-x-auto pb-2">
            <button onclick="switchTab('roda', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold transition whitespace-nowrap bg-[#FF6B00] text-white shadow-md shadow-orange-500/20">
                Roda da Vida (10 Pilares)
            </button>
            <button onclick="switchTab('planos', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold transition whitespace-nowrap text-slate-600 hover:bg-white/80">
                Planos de Ação
            </button>
            <button onclick="switchTab('bujo', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold transition whitespace-nowrap text-slate-600 hover:bg-white/80">
                Diário & Google Tarefas
            </button>
            <button onclick="switchTab('habitos', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold transition whitespace-nowrap text-slate-600 hover:bg-white/80">
                Rastreador de Hábitos
            </button>
        </nav>

        <!-- ABA 1: RODA DA VIDA -->
        <section id="tab-roda" class="tab-content mt-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <div class="lg:col-span-5 glass-card p-6 rounded-3xl">
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="text-base font-extrabold text-slate-800">Ciclo Semestral (10 Pilares)</h2>
                        <span class="text-[11px] font-bold bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-full">6 Meses</span>
                    </div>
                    <p class
